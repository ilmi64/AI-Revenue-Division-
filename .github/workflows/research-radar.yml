name: AI Automation Research Radar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-radar.yml"
      - "agent-automation/**"
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1"

permissions:
  contents: read

concurrency:
  group: research-radar
  cancel-in-progress: true

jobs:
  collect-and-analyze-public-release-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: agent-automation
        run: PYTHONPATH=. python -m unittest discover -s . -p 'test_*.py' -v
      - name: Collect public release metadata
        run: python agent-automation/research-radar.py
      - name: Install pinned Ollama version
        run: curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.16 sh
      - name: Start local Ollama service
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/api/version; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1
      - name: Download small open model
        run: ollama pull qwen2.5:1.5b
      - name: Generate AI research brief locally
        run: python agent-automation/ai_research_agent.py
      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-automation-research-radar
          path: radar-output/
          if-no-files-found: warn
          retention-days: 30
