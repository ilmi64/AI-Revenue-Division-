name: Organisation Control Centre checks

on:
  pull_request:
    paths:
      - "organization/**"
      - ".github/workflows/org-control-centre-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control-centre:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate organisation records
        run: python organization/tools/validate_readiness.py
      - name: Build cross-division dependency report
        run: python organization/tools/build_dependency_report.py
      - name: Validate division operating framework
        run: python organization/tools/validate_operating_framework.py
      - name: Validate division work queue
        run: python organization/tools/validate_work_queue.py
      - name: Build consolidated organisation dashboard
        run: python organization/tools/build_organisation_dashboard.py
      - name: Build read-only AI Revenue snapshot
        run: python organization/tools/build_executive_snapshot.py
      - name: Run all organisation tests
        run: python -m unittest discover -s organization/tests -v
