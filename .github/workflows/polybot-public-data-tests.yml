name: PolyBot Public Data Tests

on:
  push:
    branches: [feature/polybot-binance-public-data]
    paths:
      - "crypto/polybot/**"
      - ".github/workflows/polybot-public-data-tests.yml"
  pull_request:
    paths:
      - "crypto/polybot/**"
      - ".github/workflows/polybot-public-data-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline unit tests
        run: python -m unittest discover -s crypto/polybot/tests -v
