name: GitHub Revenue Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "41 13 * * 2,5"

permissions:
  contents: read

concurrency:
  group: github-revenue-opportunity-radar
  cancel-in-progress: true

jobs:
  discover-triage-risk-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agent tests
        working-directory: agent-automation
        run: |
          PYTHONPATH=. python -m unittest test_opportunity_intelligence.py -v
          PYTHONPATH=. python -m unittest test_development_task_agent.py -v
          PYTHONPATH=. python -m unittest test_risk_review_agent.py -v
          PYTHONPATH=. python -m unittest test_finance_payout_agent.py -v
      - name: Collect public GitHub opportunity leads
        run: python agent-automation/opportunity_intelligence.py
      - name: Prepare engineering triage briefs
        run: python agent-automation/development_task_agent.py
      - name: Run deterministic risk review
        run: python agent-automation/risk_review_agent.py
      - name: Prepare finance and payout due-diligence report
        run: python agent-automation/finance_payout_agent.py
      - name: Upload discovery, triage and risk reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-revenue-opportunity-radar
          path: |
            opportunity-output/
            development-output/
            risk-output/
            finance-output/
          if-no-files-found: warn
          retention-days: 30
