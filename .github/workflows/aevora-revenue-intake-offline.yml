name: Aevora revenue intake offline regression
on:
  pull_request:
    paths:
      - "operations/revenue_intake_sandbox.py"
      - "operations/test_revenue_intake_sandbox.py"
      - "operations/revenue_delivery_plan.py"
      - "operations/test_revenue_delivery_plan.py"
      - "operations/revenue_agent_queue.py"
      - "operations/test_revenue_agent_queue.py"
      - "operations/revenue_task_evidence.py"
      - "operations/test_revenue_task_evidence.py"
      - "operations/revenue_evidence_custody.py"
      - "operations/test_revenue_evidence_custody.py"
      - ".github/workflows/aevora-revenue-intake-offline.yml"
permissions:
  contents: read
jobs:
  offline-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record reviewed commit
        run: echo "Reviewed commit $GITHUB_SHA"
      - name: Compile and test offline qualification
        env:
          PYTHONPATH: operations
        run: |
          python -m py_compile operations/revenue_intake_sandbox.py operations/test_revenue_intake_sandbox.py operations/revenue_delivery_plan.py operations/test_revenue_delivery_plan.py operations/revenue_agent_queue.py operations/test_revenue_agent_queue.py operations/revenue_task_evidence.py operations/test_revenue_task_evidence.py operations/revenue_evidence_custody.py operations/test_revenue_evidence_custody.py
          python -m unittest -v test_revenue_intake_sandbox test_revenue_delivery_plan test_revenue_agent_queue test_revenue_task_evidence test_revenue_evidence_custody
