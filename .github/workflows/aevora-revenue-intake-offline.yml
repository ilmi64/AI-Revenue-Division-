name: Aevora revenue intake offline regression
on:
  pull_request:
    paths:
      - "operations/revenue_intake_sandbox.py"
      - "operations/test_revenue_intake_sandbox.py"
      - "operations/revenue_delivery_plan.py"
      - "operations/test_revenue_delivery_plan.py"
      - "operations/revenue_agent_queue.py"
      - "operations/test_revenue_agent_queue.py"
      - "operations/revenue_task_evidence.py"
      - "operations/test_revenue_task_evidence.py"
      - "operations/revenue_evidence_custody.py"
      - "operations/test_revenue_evidence_custody.py"
      - "operations/revenue_review_separation.py"
      - "operations/test_revenue_review_separation.py"
      - "operations/revenue_identity_boundary.py"
      - "operations/test_revenue_identity_boundary.py"
      - "operations/revenue_release_gate.py"
      - "operations/test_revenue_release_gate.py"
      - "operations/revenue_commissioning_snapshot.py"
      - "operations/test_revenue_commissioning_snapshot.py"
      - "operations/revenue_occ_export.py"
      - "operations/test_revenue_occ_export.py"
      - "operations/revenue_occ_import.py"
      - "operations/test_revenue_occ_import.py"
      - ".github/workflows/aevora-revenue-intake-offline.yml"
permissions:
  contents: read
jobs:
  offline-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record reviewed commit
        run: echo "Reviewed commit $GITHUB_SHA"
      - name: Compile and test offline qualification
        env:
          PYTHONPATH: operations
        run: |
          python -m py_compile operations/revenue_intake_sandbox.py operations/test_revenue_intake_sandbox.py operations/revenue_delivery_plan.py operations/test_revenue_delivery_plan.py operations/revenue_agent_queue.py operations/test_revenue_agent_queue.py operations/revenue_task_evidence.py operations/test_revenue_task_evidence.py operations/revenue_evidence_custody.py operations/test_revenue_evidence_custody.py operations/revenue_review_separation.py operations/test_revenue_review_separation.py operations/revenue_identity_boundary.py operations/test_revenue_identity_boundary.py operations/revenue_release_gate.py operations/test_revenue_release_gate.py operations/revenue_commissioning_snapshot.py operations/test_revenue_commissioning_snapshot.py operations/revenue_occ_export.py operations/test_revenue_occ_export.py operations/revenue_occ_import.py operations/test_revenue_occ_import.py
          python -m unittest -v test_revenue_intake_sandbox test_revenue_delivery_plan test_revenue_agent_queue test_revenue_task_evidence test_revenue_evidence_custody test_revenue_review_separation test_revenue_identity_boundary test_revenue_release_gate test_revenue_commissioning_snapshot test_revenue_occ_export test_revenue_occ_import
